post:
    email:
        - NotBlank:
              message: 'validation.not_blank'
        - Email:
              message: 'validation.email'
        - Length:
              max: 100
              maxMessage: 'validation.max_length.plural'

    salutation:
        - NotBlank:
              message: 'validation.not_blank'
        - Choice:
              choices: [Mr, Mrs, Dr, Ms, 'n/a']
              message: 'validation.choice'

    firstName:
        - NotBlank:
              message: 'validation.not_blank'
        - Length:
              max: 100
              maxMessage: 'validation.max_length.plural'
        - Regex:
              pattern: '/^[^:\/<>]+$/'

    lastName:
        - NotBlank:
              message: 'validation.not_blank'
        - Length:
              max: 100
              maxMessage: 'validation.max_length.plural'
        - Regex:
              pattern: '/^[^:\/<>]+$/'

    gender:
        - Choice:
              choices: [Male, Female]
              message: 'validation.choice'

    dateOfBirth:
        - Date:
              message: 'Please provide a valid date in YYYY-MM-DD format'

    phone:
        - Length:
              max: 255
              maxMessage: 'validation.max_length.plural'

    company:
        - Length:
              max: 100
              maxMessage: 'validation.max_length.plural'

    localeName:
        - Length:
              max: 15
              maxMessage: 'validation.max_length.plural'

    storeName:
        - Length:
              max: 255
              maxMessage: 'validation.max_length.plural'

patch:
