post:
    email:
        - NotBlank
        - Email
        - Length:
              max: 100

    salutation:
        - NotBlank
        - Choice:
              choices: [Mr, Mrs, Dr, Ms, 'n/a']
              message: 'This value is not valid.'

    firstName:
        - NotBlank
        - Length:
              max: 100
        - Regex:
              pattern: '/^[^:\/<>]+$/'

    lastName:
        - NotBlank
        - Length:
              max: 100
        - Regex:
              pattern: '/^[^:\/<>]+$/'

    gender:
        - Choice:
              choices: [Male, Female]
              message: 'This value is not valid.'

    dateOfBirth:
        - Date:
              message: 'Please provide a valid date in YYYY-MM-DD format'

    phone:
        - Length:
              max: 255

    company:
        - Length:
              max: 100

    localeName:
        - Length:
              max: 15

    storeName:
        - NotBlank:
              message: 'validation.not_blank'
        - Length:
              max: 255

patch:
    email:
        - Optional:
              constraints:
                  - NotBlank
                  - Email
                  - Length:
                        max: 100

    salutation:
        - Optional:
              constraints:
                  - NotBlank
                  - Choice:
                        choices: [Mr, Mrs, Dr, Ms, 'n/a']
                        message: 'This value is not valid.'

    firstName:
        - Optional:
              constraints:
                  - NotBlank
                  - Length:
                        max: 100
                  - Regex:
                        pattern: '/^[^:\/<>]+$/'

    lastName:
        - Optional:
              constraints:
                  - NotBlank
                  - Length:
                        max: 100
                  - Regex:
                        pattern: '/^[^:\/<>]+$/'

    gender:
        - Optional:
              constraints:
                  - Choice:
                        choices: [Male, Female]
                        message: 'This value is not valid.'

    dateOfBirth:
        - Optional:
              constraints:
                  - Date:
                        message: 'Please provide a valid date in YYYY-MM-DD format'

    phone:
        - Optional:
              constraints:
                  - Length:
                        max: 255

    company:
        - Optional:
              constraints:
                  - Length:
                        max: 100

    localeName:
        - Optional:
              constraints:
                  - Length:
                        max: 15

    storeName:
        - Optional:
              constraints:
                  - Length:
                        max: 255
