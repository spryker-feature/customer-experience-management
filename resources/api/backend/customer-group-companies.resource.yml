resource:
    name: CustomerGroupsCompanies
    shortName: customer-group-companies
    description: 'Company memberships of a customer group (list the member companies, add companies, replace the whole set, remove one company)'

    provider: SprykerFeature\Glue\CustomerExperienceManagement\Api\Backend\Provider\CustomerGroupCompaniesBackendProvider
    processor: SprykerFeature\Glue\CustomerExperienceManagement\Api\Backend\Processor\CustomerGroupCompaniesBackendProcessor

    paginationEnabled: true
    paginationItemsPerPage: 10
    paginationMaximumItemsPerPage: 100

    security: "is_granted('ROLE_BACK_OFFICE_USER')"

    operations:
        - type: GetCollection
          name: getCustomerGroupCompanies
          description: >-
              Retrieve the companies assigned to the group as a whole.
              Pagination (JSON:API): `page[limit]` (default 10, at most 100), `page[offset]` (default 0, rounded
              down to a multiple of `page[limit]`); the pagination summary is returned as top-level
              `meta.pagination` with `links.first/last/prev/next`.
              Free-text search: `q`, matched against the company name, ignoring case.
              Sorting: `sort` accepts name, prefixed with `-` for descending; an unsupported field returns 400.
              Without `sort`, the companies are listed in the order in which they were created. Companies with the
              same name keep a fixed order, so paging never repeats or skips one.
              Each item carries the uuid and the name of its company. With `include=companies`, each item also gets the
              `companies` relationship, and the companies are returned in `included`.
              A company membership is independent of the group's business unit memberships: a group can hold
              business units of a company without holding the company itself.
          uriTemplate: '/customer-groups/{uuid}/companies'
          uriVariables:
              uuid:
                  identifiers: [uuid]
          openapiContext:
              summary: 'List the companies of a customer group'
              parameters:
                  - name: 'q'
                    in: query
                    required: false
                    description: 'Free-text search, matched against the company name, ignoring case.'
                    schema:
                        type: string
                    example: 'acme'
                  - name: 'sort'
                    in: query
                    required: false
                    description: 'Sort field, prefixed with `-` for descending order. Any other field returns 400 (error code 1203).'
                    schema:
                        type: string
                        enum: ['name', '-name']
                    example: 'name'
              responses:
                  200:
                      description: 'Assigned companies returned, with JSON:API pagination links.'
                  400:
                      description: 'Unsupported sort field (error code 1203), or a filter, which this collection does not support (error code 1215).'
                  401:
                      description: 'Missing or expired access token.'
                  403:
                      description: 'The operator has no access to this resource.'
                  404:
                      description: 'No customer group matches the uuid (error code 1222).'

        - type: Post
          name: assignCompaniesToCustomerGroup
          description: >-
              Add companies to the group. The body carries `companyUuids`, a required, non-empty array of at most 1000
              company uuids without duplicates. All-or-nothing: if any uuid matches no company, nothing is added and
              every unknown uuid is listed in `errors[]`. Companies that are already assigned are skipped, so sending
              the same request twice changes nothing the second time.
              The membership is written the same way as a save in the Back Office. The companies, their business
              units and their users are not changed, and the group's business unit memberships stay as they are.
              This operation only adds. To replace the whole set in one call, use `PATCH` on this same path.
          uriTemplate: '/customer-groups/{uuid}/companies'
          uriVariables:
              uuid:
                  identifiers: [uuid]
          deserialize: true
          read: false
          output: false
          status: 204
          openapiContext:
              summary: 'Add companies to a customer group'
              requestBody:
                  content:
                      application/vnd.api+json:
                          example:
                              data:
                                  type: 'customer-group-companies'
                                  attributes:
                                      companyUuids: ['0818f408-cc84-575d-ad54-92118a0e4273']
              responses:
                  204:
                      description: 'The companies are assigned to the group; companies that were already assigned were skipped.'
                  400:
                      description: 'Malformed request body — unparseable JSON, a missing JSON:API `data` member, or a property whose JSON type does not match the schema.'
                  401:
                      description: 'Missing or expired access token.'
                  403:
                      description: 'The operator has no access to this resource.'
                  404:
                      description: 'No customer group matches the uuid (error code 1222).'
                  422:
                      description: >-
                          Nothing was added: `companyUuids` was missing or empty, more than 1000 uuids were sent, the list
                          contains duplicates or a value that is not a uuid, or one or more uuids match no company (error
                          code 1236, one `errors[]` entry per unknown uuid).

        - type: Patch
          name: replaceCustomerGroupCompanies
          description: >-
              Replace the whole company assignment. The `companyUuids` you send become the complete new set of member
              companies, so include every company the group should keep. Companies missing from the list are removed
              from the group; the companies themselves, and their memberships in other groups, are untouched. An
              empty array removes every company membership of the group, with one statement whatever the group size,
              and sending it again changes nothing.
              `companyUuids` is required: a body without it is rejected rather than read as an empty set.
              At most 1000 uuids per request, without duplicates. All-or-nothing: if any uuid matches no company,
              nothing changes and every unknown uuid is listed in `errors[]`.
              The group's business unit memberships stay as they are. Use `POST` on this path to add without
              removing, and `DELETE /customer-groups/{uuid}/companies/{companyUuid}` to remove one company.
          uriTemplate: '/customer-groups/{uuid}/companies'
          uriVariables:
              uuid:
                  identifiers: [uuid]
          deserialize: true
          read: false
          output: false
          status: 204
          openapiContext:
              summary: 'Replace the companies of a customer group'
              requestBody:
                  content:
                      application/vnd.api+json:
                          example:
                              data:
                                  type: 'customer-group-companies'
                                  attributes:
                                      companyUuids: ['0818f408-cc84-575d-ad54-92118a0e4273']
              responses:
                  204:
                      description: 'The member companies of the group are exactly the companies sent. An empty array left the group without companies.'
                  400:
                      description: 'Malformed request body — unparseable JSON, a missing JSON:API `data` member, or a property whose JSON type does not match the schema.'
                  401:
                      description: 'Missing or expired access token.'
                  403:
                      description: 'The operator has no access to this resource.'
                  404:
                      description: 'No customer group matches the uuid (error code 1222).'
                  422:
                      description: >-
                          Nothing changed: `companyUuids` was missing, more than 1000 uuids were sent, the list contains
                          duplicates or a value that is not a uuid, or one or more uuids match no company (error code
                          1236, one `errors[]` entry per unknown uuid).

        - type: Delete
          name: unassignCompanyFromCustomerGroup
          description: >-
              Remove one company from the group. The company, its memberships in other groups and the group's
              business unit memberships are untouched.
          uriTemplate: '/customer-groups/{uuid}/companies/{companyUuid}'
          uriVariables:
              uuid:
                  identifiers: [uuid]
              companyUuid:
                  identifiers: [companyUuid]
          read: false
          status: 204
          openapiContext:
              summary: 'Remove a company from a customer group'
              responses:
                  204:
                      description: 'The company is no longer assigned to the group. The company is kept.'
                  401:
                      description: 'Missing or expired access token.'
                  403:
                      description: 'The operator has no access to this resource.'
                  404:
                      description: 'No customer group matches the uuid (error code 1222), or the company is not assigned to it (error code 1237).'

    includes:
        - relationshipName: companies
          targetResource: Companies
          resolverClass: SprykerFeature\Glue\CustomerExperienceManagement\Api\Backend\Relationship\CompaniesRelationshipResolver

    properties:
        companyUuid:
            type: string
            identifier: true
            writable: false
            readable: true
            required: true
            description: 'Uuid of the assigned company. Links the membership to the `companies` resource.'
            openapiContext:
                example: '0818f408-cc84-575d-ad54-92118a0e4273'

        companyName:
            type: string
            writable: false
            readable: true
            required: true
            description: 'Name of the assigned company, for display.'
            openapiContext:
                example: 'Spryker Systems GmbH'

        uuid:
            type: string
            writable: false
            readable: false
            required: false
            description: 'Uuid of the customer group, taken from the URL. Never accepted in a request body and never returned.'
            openapiContext:
                example: '4b1e6a02-9f37-5c48-b6d1-2e8a70c9f4a5'

        companyUuids:
            type: array
            writable: true
            readable: false
            required: true
            nullable: true
            description: >-
                Company uuids the operation applies, at most 1000 per request, without duplicates.
                On add (`POST`): the companies to add; must not be empty.
                On replace (`PATCH`): the complete new set of member companies; an empty array removes every company.
                Required by both, never returned.
            openapiContext:
                items:
                    type: string
                example: ['0818f408-cc84-575d-ad54-92118a0e4273']
