post:
    salutation:
        - NotBlank
        - Choice:
              choices: ['Mr', 'Mrs', 'Dr', 'Ms', 'n/a']
              message: 'This value is not valid.'

    firstName:
        - NotBlank
        - Length:
              min: 2
              max: 100
              minMessage: 'This field must be at least {{ limit }} characters long.'
        - Regex:
              pattern: '/^[^:\/<>]+$/'

    lastName:
        - NotBlank
        - Length:
              min: 2
              max: 100
              minMessage: 'This field must be at least {{ limit }} characters long.'
        - Regex:
              pattern: '/^[^:\/<>]+$/'

    address1:
        - NotBlank
        - Length:
              min: 2
              max: 255
              minMessage: 'This field must be at least {{ limit }} characters long.'

    address2:
        - NotBlank
        - Length:
              max: 255

    address3:
        - Optional:
              constraints:
                  - Length:
                        max: 255

    city:
        - NotBlank
        - Length:
              min: 2
              max: 255
              minMessage: 'This field must be at least {{ limit }} characters long.'

    zipCode:
        - NotBlank
        - Length:
              max: 15

    iso2Code:
        - NotBlank
        - Country: ~

    region:
        - Optional:
              constraints:
                  - Length:
                        max: 6

    phone:
        - Optional:
              constraints:
                  - Length:
                        max: 255

    company:
        - Optional:
              constraints:
                  - Length:
                        max: 255

    comment:
        - Optional:
              constraints:
                  - Length:
                        max: 255

